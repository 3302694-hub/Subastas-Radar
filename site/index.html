      <a href="#alertas" data-nav="alerts" data-i="nav_alerts"></a>
      <a href="servicios.html" data-i="nav_services"></a>
    </nav>
    <div class="modes" role="group" id="modeSwitch" data-i-aria="mode_label">

        <div class="user-menu" id="userMenu" hidden><a href="#" data-my-notas="1" data-i="nota_mine"></a><a id="adminLink" href="admin.html" hidden>Панель управления</a><button id="logoutBtn" data-i="logout"></button></div>
      </div>
    </div>
    <button class="icon-btn settings-btn" id="settingsBtn" data-i-aria="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>

<main id="main">
  <!-- Поиск и фильтры: один источник правды для всех режимов -->
  <section class="searchbar" role="search" aria-labelledby="resTitle">
    <div class="wrap sb-in">
      <div class="segs" id="segs" role="group"></div>
      <div class="sb-row">
        <label class="f-search"><span class="sr" data-i="search_label"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" data-i-ph="search_ph" autocomplete="off" enterkeyhint="search">
          <kbd class="kbd-hint" aria-hidden="true">/</kbd>
        </label>
        <label class="f-sel f-cat"><span data-i="f_category"></span><select id="fCat"></select></label>
        <label class="f-sel"><span data-i="f_province"></span><select id="fProv"></select></label>
        <label class="f-sel"><span data-i="f_price_max"></span><select id="fPrice"></select></label>
        <button class="btn soft more-f" id="moreFilters" aria-expanded="false" aria-controls="adv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i="more_filters"></span><span class="pill" id="advCount" hidden>0</span></button>
      </div>
      <div class="adv" id="adv" hidden>
        <fieldset><legend data-i="f_origin"></legend><div class="chips" id="fOrigin"></div></fieldset>
        <label class="f-sel"><span data-i="f_status"></span><select id="fStatus"></select></label>
        <label class="f-sel"><span data-i="f_fresh"></span><select id="fFresh"></select></label>
        <fieldset class="f-range"><legend data-i="f_price"></legend>
          <span class="range"><label><span class="sr" data-i="f_min"></span><input id="pMin" type="number" min="0" step="1000" inputmode="numeric"></label><i aria-hidden="true">—</i><label><span class="sr" data-i="f_max"></span><input id="pMax" type="number" min="0" step="1000" inputmode="numeric"></label></span>
          <span class="f-err" id="rangeErr" role="alert" hidden></span>
        </fieldset>
        <label class="f-check"><input type="checkbox" id="fRisk"><span data-i="f_norisk"></span></label>
      </div>
      <div class="sb-foot">
        <h1 id="resTitle" class="res-title"></h1>
        <p class="res-count" aria-live="polite"><span id="resCount"></span></p>
        <div class="active" id="active" aria-label="filtros activos"></div>
        <div class="sb-tools">
          <label class="sort"><span data-i="f_sort"></span><select id="sort"></select></label>
          <button id="clearFilters" class="btn ghost" type="button" data-rm="*" data-i="reset" hidden></button>
          <button id="saveSearch" class="btn soft" data-i="save_search"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Каталог: разметка зависит от режима -->
  <section class="wrap catalog" id="catalogo" tabindex="-1">
    <div class="cat-main" id="catMain">
      <div class="pro-map" id="proMap" hidden></div>
      <div class="results" id="results">
        <div id="list"></div>
        <div class="more-row"><button id="more" class="btn soft" data-i="more" hidden></button></div>
      </div>
    </div>
    <aside class="cat-side" id="catSide">
      <div class="panel" id="panel" hidden></div>
      <div class="guide" id="guide">
        <h2 data-i="guide_title"></h2>
        <ul>
          <li><b data-i="g1_t"></b><span data-i="g1_d"></span></li>
          <li><b data-i="g2_t"></b><span data-i="g2_d"></span></li>
          <li><b data-i="g3_t"></b><span data-i="g3_d"></span></li>
          <li><b data-i="g4_t"></b><span data-i="g4_d"></span></li>
        </ul>
        <p class="fine" id="guideTrial"></p>
      </div>
    </aside>
  </section>

  <!-- Карта (в режимах Новичок и Инвестор — отдельный блок; в Про — главная часть) -->
  <section class="wrap block" id="mapSec">
    <div class="block-head"><h2 data-i="map_title"></h2><p class="muted" data-i="map_hint"></p></div>
    <div class="map-wrap" id="mapWrap">
      <div id="map" role="region" data-i-aria="map_title"><p class="map-off" data-i="map_off"></p></div>
      <div class="prov-list" id="provList"></div>
    </div>
  </section>

  <!-- Уведомления и сохранённые поиски -->
  <section class="wrap block" id="alertas">
    <h2 data-i="alerts_title"></h2>
    <div class="alert-grid">
      <div class="acard">
        <h3 data-i="alerts_saved"></h3>
        <p data-i="alerts_saved_d"></p>
        <ul class="saved-list" id="savedList"></ul>
      </div>
      <a class="acard" id="rssLink" href="feed.xml"><h3 data-i="alerts_rss"></h3><p data-i="alerts_rss_d"></p><em data-i="subscribe"></em></a>
      <a class="acard" id="tgLink" href="#" target="_blank" rel="noopener" hidden><h3 data-i="alerts_tg"></h3><p data-i="alerts_tg_d"></p><em data-i="subscribe"></em></a>
    </div>
  </section>
</main>

    <div class="set-account" id="setAccount"></div>
  </div>
</dialog>

<dialog id="authDlg" class="dlg auth" aria-labelledby="authLead">
  <div class="d-head">
    <button class="d-close" data-close data-i-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="tabs" id="authTabs">
      <button data-mode="signup" data-i="signup"></button>
      <button data-mode="login" data-i="login"></button>
    </div>
    <p class="muted" id="authLead"></p>
  </div>
  <div class="d-body">
    <div class="oauth" id="oauthBox">
      <div id="gsiBtn" class="gsi-btn" hidden></div>
      <button class="btn oauth-btn" data-provider="google"><span class="o-ic" aria-hidden="true">G</span><span data-i="with_google"></span></button>
      <button class="btn oauth-btn" data-provider="apple"><span data-i="with_apple"></span></button>
      <div class="or"><span data-i="or"></span></div>
    </div>
    <form id="authForm" autocomplete="on">
      <label><span data-i="email"></span><input type="email" id="authEmail" required autocomplete="email"></label>
      <label id="pwRow"><span data-i="password"></span><input type="password" id="authPw" minlength="8" required autocomplete="current-password"></label>
      <button class="btn big" type="submit" id="authSubmit"></button>
      <button class="link-btn" type="button" id="forgotBtn" data-i="forgot"></button>
    </form>
    <p class="auth-msg" id="authMsg" role="status" hidden></p>
    <p class="fine" data-i="device_note"></p>
  </div>
</dialog>
