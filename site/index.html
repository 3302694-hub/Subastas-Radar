<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubastaRadar — subastas públicas en España</title>
<meta name="description" content="Nuevas subastas judiciales, notariales y de Hacienda del Portal de Subastas del BOE, actualizadas automáticamente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22none%22 stroke=%22%23c4512b%22 stroke-width=%222%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%23c4512b%22/%3E%3C/svg%3E">
<link rel="alternate" type="application/rss+xml" title="Nuevas subastas" href="feed.xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#" data-nav="list">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><b id="brandName">SubastaRadar</b><small id="brandTag"></small></span>
    </a>
    <nav class="nav">
      <a href="#" data-nav="list" data-i="nav_list"></a>
      <a href="#mapa" data-nav="map" data-i="nav_map"></a>
      <a href="#alertas" data-nav="alerts" data-i="nav_alerts"></a>
      <a href="#" data-nav="saved"><span data-i="nav_saved"></span> <span class="pill" id="favCount">0</span></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma">
      <button data-lang="es">ES</button><button data-lang="ru">RU</button>
    </div>
  </div>
</header>

<div id="demoBanner" class="demo" hidden><div class="wrap" data-i="demo"></div></div>

<section class="hero">
  <div class="wrap">
    <h1 data-i="hero_title"></h1>
    <p data-i="hero_sub"></p>
    <div class="stats">
      <div><b id="stActive">—</b><span data-i="stat_active"></span></div>
      <div><b id="stNew">—</b><span data-i="stat_new24"></span></div>
      <div><b id="stUpdated">—</b><span data-i="stat_updated"></span></div>
    </div>
  </div>
</section>

<div id="savedNotice" class="notice" hidden><div class="wrap"></div></div>

<main class="wrap layout">
  <aside class="filters" id="filters">
    <input id="q" type="search" class="search" data-i-ph="search_ph" autocomplete="off">
    <fieldset><legend data-i="f_origin"></legend><div class="chips" id="fOrigin"></div></fieldset>
    <label><span data-i="f_category"></span><select id="fCat"></select></label>
    <label><span data-i="f_province"></span><select id="fProv"></select></label>
    <label><span data-i="f_status"></span><select id="fStatus"></select></label>
    <fieldset><legend data-i="f_price"></legend>
      <div class="range"><input id="pMin" type="number" min="0" step="1000" inputmode="numeric"><span>—</span><input id="pMax" type="number" min="0" step="1000" inputmode="numeric"></div>
    </fieldset>
    <label><span data-i="f_fresh"></span><select id="fFresh"></select></label>
    <div class="f-actions">
      <button id="saveSearch" class="btn" data-i="save_search"></button>
      <button id="reset" class="btn ghost" data-i="reset"></button>
    </div>
  </aside>

  <section class="results">
    <div class="res-head">
      <p><b id="resCount">0</b> <span data-i="results"></span></p>
      <label class="sort"><span data-i="f_sort"></span><select id="sort"></select></label>
    </div>
    <div id="list" class="grid"></div>
    <div class="more-row"><button id="more" class="btn ghost" data-i="more" hidden></button></div>

    <section id="mapa" class="block">
      <h2 data-i="map_title"></h2>
      <p class="muted" data-i="map_hint"></p>
      <div id="map"></div>
      <h3 data-i="prov_title"></h3>
      <div id="provList" class="prov-list"></div>
    </section>

    <section id="alertas" class="block">
      <h2 data-i="alerts_title"></h2>
      <div class="alert-cards">
        <a class="acard" id="rssLink" href="feed.xml"><b data-i="alerts_rss"></b><span data-i="alerts_rss_d"></span><em data-i="subscribe"></em></a>
        <a class="acard" id="tgLink" href="#" target="_blank" rel="noopener" hidden><b data-i="alerts_tg"></b><span data-i="alerts_tg_d"></span><em data-i="subscribe"></em></a>
        <div class="acard"><b data-i="alerts_saved"></b><span data-i="alerts_saved_d"></span></div>
      </div>
    </section>
  </section>
</main>

<footer class="foot"><div class="wrap"><p data-i="footer_src"></p></div></footer>

<dialog id="detail" class="detail"><div id="detailBody"></div></dialog>

<script src="config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/provinces.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="assets/app.js"></script>
</body>
</html>
