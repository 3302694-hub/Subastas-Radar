name: Автоархив документов (избранное)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Номера аукционов через пробел (пусто — избранное администраторов)"
        required: false
        default: ""
  # расписание отключено: задачи по расписанию перенесены на собственный сервер (server/)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Скачать документы
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IDS: ${{ inputs.ids }}
        run: python scraper/docs_fav.py $IDS
