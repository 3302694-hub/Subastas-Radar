name: Архив завершённых аукционов

on:
  schedule:
    - cron: "47 */4 * * *"     # каждые 4 часа; каждый запуск продолжает с того же места
  workflow_dispatch:
    inputs:
      months:
        description: "Сколько месяцев назад собирать"
        default: "12"
      budget:
        description: "Лимит времени, минут"
        default: "170"
  push:
    branches: [main]
    paths: ["scraper/history.py", ".github/workflows/history.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  history:
    runs-on: ubuntu-latest
    concurrency:
      group: history
      cancel-in-progress: false
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сбор завершённых аукционов
        env:
          SITE_URL: https://subastica.es
          SITE_NAME: ${{ vars.SITE_NAME }}
        run: python scraper/history.py --months "${{ github.event.inputs.months || '12' }}" --budget-min "${{ github.event.inputs.budget || '170' }}"
      - name: Сохранить архив в репозиторий
        if: always()
        run: |
          git config user.name "subastas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data/historico
          git diff --cached --quiet && exit 0
          git commit -m "Архив завершённых аукционов $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done

  deploy:
    needs: [history]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sed -i -E "s/\?v=[0-9A-Za-z]+/?v=${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
