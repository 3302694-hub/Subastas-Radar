name: debug-mivau
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install xlrd
      - run: python tools/mivau_dump.py https://apps.fomento.gob.es/BoletinOnline2/sedal/35103500.XLS https://apps.fomento.gob.es/BoletinOnline2/sedal/35101000.XLS
