name: Соцсети — материалы для рилс
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Номера аукционов через пробел"
        required: true
      music:
        description: "Ссылка на музыку (необязательно)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Скачать материалы
        env:
          IDS: ${{ inputs.ids }}
          MUSIC: ${{ inputs.music }}
        run: |
          set -e
          ARGS=()
          for i in $IDS; do [[ "$i" =~ ^SUB-[A-Z]{2}-[0-9]{4}-[0-9A-Z]+$ ]] && ARGS+=("$i"); done
          [ -n "$MUSIC" ] && ARGS+=(--music "$MUSIC")
          python tools/social_assets.py "${ARGS[@]}"
          git config user.name "subastica-bot"; git config user.email "bot@subastica.es"
          git add site/social/src && git commit -m "Материалы для соцсетей" && git pull --rebase && git push || echo "нечего коммитить"
