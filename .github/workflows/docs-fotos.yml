name: Фото из документов аукционов
on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Номер аукциона для листа-превью фото (необязательно)"
        required: false
        default: ""
  schedule:
    - cron: "*/15 * * * *"   # быстро выходит, если новых документов нет
permissions:
  contents: write
concurrency:
  group: docs-fotos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pymupdf pillow numpy
      - name: Вынуть фото
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/docs_fotos.py
      - name: Превью фото
        if: ${{ inputs.preview != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SID: ${{ inputs.preview }}
        run: |
          [[ "$SID" =~ ^SUB-[A-Z]{2}-[0-9]{4}-[0-9A-Z]+$ ]] || exit 1
          python scraper/docs_fotos.py --preview "$SID"
          git config user.name "subastaradar-bot"; git config user.email "bot@subasta-radar.es"
          git add site/social/src/preview && git commit -m "Превью фото $SID" && git pull --rebase && git push || true
