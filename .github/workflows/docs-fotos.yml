name: Фото из документов аукционов
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # быстро выходит, если новых документов нет
concurrency:
  group: docs-fotos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pymupdf pillow numpy
      - name: Вынуть фото
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/docs_fotos.py
