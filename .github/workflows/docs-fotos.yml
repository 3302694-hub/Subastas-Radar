name: Фото из документов аукционов
on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Номер аукциона для листа-превью фото (необязательно)"
        required: false
        default: ""
      aereo:
        description: "Аэрофото с границей участка для аукционов (номера через пробел, необязательно)"
        required: false
        default: ""
  # расписание отключено: задачи по расписанию перенесены на собственный сервер (server/)
permissions:
  contents: write
concurrency:
  group: docs-fotos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pymupdf pillow numpy
      - name: Вынуть фото
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/docs_fotos.py
      - name: Аэрофото участков
        if: ${{ inputs.aereo != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IDS: ${{ inputs.aereo }}
        run: |
          ARGS=(); for i in $IDS; do [[ "$i" =~ ^SUB-[A-Z]{2}-[0-9]{4}-[0-9A-Z]+$ ]] && ARGS+=("$i"); done
          [ ${#ARGS[@]} -gt 0 ] && python scraper/docs_fotos.py --aereo "${ARGS[@]}"
      - name: Превью фото
        if: ${{ inputs.preview != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jkxvxdhmothlamhotecu.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SID: ${{ inputs.preview }}
        run: |
          [[ "$SID" =~ ^SUB-[A-Z]{2}-[0-9]{4}-[0-9A-Z]+$ ]] || exit 1
          python scraper/docs_fotos.py --preview "$SID"
          python scraper/docs_fotos.py --debug "$SID"
          git config user.name "subastica-bot"; git config user.email "bot@subastica.es"
          git add site/social/src/preview && git commit -m "Превью фото $SID" && git pull --rebase && git push || true
